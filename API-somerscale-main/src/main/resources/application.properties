spring.application.name=proyecto.somerscale

# Base de Datos - Supabase Postgres (variables en .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate - Flyway es la fuente de verdad del schema; JPA solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Supabase pre-creates extensions/functions in the public schema, which makes
# Flyway treat it as non-empty. baseline-on-migrate=true with version 0 means:
# create the history table, mark baseline as V0, then apply V1..V5 in order.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Multipart - avatar uploads (task029). 2 MB is the avatar cap; pre-resize
# images on the FE keep us well under this. max-request slightly above to
# accommodate the multipart overhead headers.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Correo - SMTP (Gmail en prod; dev profile sobreescribe con mock).
# Sin credenciales el envio fallara en runtime; usa SPRING_PROFILES_ACTIVE=dev
# para registrar los correos en el log en lugar de enviarlos por SMTP real.
# Disable mail health indicator: actuator's MailHealthIndicator opens a
# STARTTLS handshake against smtp.gmail.com on every /actuator/health hit,
# which is slow (~5s) and times out under HF Spaces' default egress policy.
# Functional invite delivery is unaffected; we just stop /health going DOWN
# because of a probe that doesn't reflect real failure.
management.health.mail.enabled=false
management.endpoint.health.show-components=always
spring.mail.host=${MAIL_HOST:disabled.dev.invalid}
spring.mail.port=${MAIL_PORT:0}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
# Toggle SMTP transport via env vars so we can switch between Gmail's
# 587/STARTTLS and 465/SSL without a redeploy. Default keeps 587/STARTTLS
# behavior (matches local dev).
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
# Bound SMTP socket calls so a blocked egress fails the request in ~10s
# instead of hanging forever. JavaMail defaults to no timeout, which made
# /api/users/invite stall for 90s+ on HF Spaces' firewalled environment.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Invitaciones de personal (task004)
app.invitation.ttl-hours=72
app.invitation.sender-email=${MAIL_FROM:no-reply@somerscales.local}
app.invitation.sender-name=Somerscales
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Resend HTTP API for invitation emails (task017). HF Spaces blocks all
# outbound SMTP (ports 587 + 465 both timeout at TCP connect), so the
# production path posts to api.resend.com/emails over HTTPS instead.
# When api-key is blank, InvitationService falls back to the existing
# JavaMailSender (the dev profile log mock locally; SMTP elsewhere).
# Once a custom domain is verified in Resend, set RESEND_FROM on the host
# (e.g., "Somerscales <noreply@somerscales-mvp.online>"); the default
# onboarding@resend.dev only delivers to the Resend account owner.
integrations.resend.api-key=${RESEND_API_KEY:}
integrations.resend.from=${RESEND_FROM:onboarding@resend.dev}

# Cifrado AES-GCM de huespedes.numero_documento (task005). Llaves base64 32B.
app.encryption.key=${APP_ENCRYPTION_KEY:}
app.hmac.key=${APP_HMAC_KEY:}

# Faker seed de demo (task007). Activar con DEMO_SEED=true en .env.
# Solo siembra cuando huespedes < 50, asi no duplica si ya hay datos reales.
app.demo.seed=${DEMO_SEED:false}
app.demo.huespedes=200
app.demo.reservas=500

# Google Places review sync (task011). Cron en UTC; default 04:00 diario.
# fixture-dir activa el modo demo offline cuando la api-key esta vacia:
# lee tests/google-places-{es,en}.json en lugar de llamar a la API real.
integrations.google.places.api-key=${GOOGLE_PLACES_API_KEY:}
integrations.google.places.place-id=${GOOGLE_PLACES_PLACE_ID:}
integrations.google.places.cron=${GOOGLE_PLACES_CRON:0 0 4 * * *}
integrations.google.places.fixture-dir=${GOOGLE_PLACES_FIXTURE_DIR:../tests}
integrations.google.places.languages=es,en

# TripAdvisor Content API review sync (task012). Cron en UTC; default 04:30
# diario (30 min despues de Google Places para evitar contencion del DB).
# Cuando la api-key esta vacia, el sync lee tests/tripadvisor-{es,en}.json
# y omite la llamada HTTP a api.content.tripadvisor.com.
integrations.tripadvisor.api-key=${TRIPADVISOR_API_KEY:}
integrations.tripadvisor.location-id=${TRIPADVISOR_LOCATION_ID:}
integrations.tripadvisor.cron=${TRIPADVISOR_CRON:0 30 4 * * *}
integrations.tripadvisor.fixture-dir=${TRIPADVISOR_FIXTURE_DIR:../tests}
integrations.tripadvisor.languages=es,en

# Google Gemini 2.5 Flash classifier (task013). Backfills sentiment + summary
# + categories + key phrases for reviews where sentiment IS NULL. Cron en UTC;
# default 05:00 diario (30 min despues del fetch de TripAdvisor). Sin api-key
# el classifier se desactiva y los reviews quedan sin clasificar.
# Throttle: free tier de Gemini 2.5 Flash permite 15 RPM; 4000ms entre llamadas
# deja margen para reintentos. Daily cap: 1500 RPD del free tier.
integrations.gemini.api-key=${GEMINI_API_KEY:}
integrations.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
integrations.gemini.batch-size=${GEMINI_BATCH_SIZE:10}
integrations.gemini.throttle-ms=${GEMINI_THROTTLE_MS:4000}
integrations.gemini.daily-cap=${GEMINI_DAILY_CAP:1500}
integrations.gemini.classify-cron=${GEMINI_CLASSIFY_CRON:0 0 5 * * *}
