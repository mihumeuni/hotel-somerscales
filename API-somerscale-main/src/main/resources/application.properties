spring.application.name=proyecto.somerscale

# Base de Datos - Supabase Postgres (variables en .env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate - Flyway es la fuente de verdad del schema; JPA solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Correo - Brevo SMTP (Brevo free tier 300/day). Sin credenciales el envio fallara
# en runtime; usa SPRING_PROFILES_ACTIVE=dev para registrar los correos en el log
# en lugar de enviarlos por SMTP real.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Invitaciones de personal (task004)
app.invitation.ttl-hours=72
app.invitation.sender-email=${BREVO_SENDER_EMAIL:no-reply@somerscales.local}
app.invitation.sender-name=Somerscales
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
