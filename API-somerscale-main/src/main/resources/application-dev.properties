# Perfil 'dev' - usado mientras no haya cuenta Brevo (o para desarrollo local).
# La beana MailSender de MailConfig.devMailSender() registra los correos en el
# log en vez de enviarlos por SMTP. Drop o cambia a 'prod' cuando .env tenga
# BREVO_SMTP_LOGIN/BREVO_SMTP_KEY/BREVO_SENDER_EMAIL configurados.
spring.mail.host=disabled.dev.invalid
spring.mail.port=0
